<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Watch | Claraoke</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/video-js.css">
  <script src="/assets/js/video.min.js"></script>
</head>
<body>

<div id="watch-page">
  <div id="player-wrap">
    <div id="player-header" class="player-header">
      <h3 id="watch-title" class="video-title">Loading video…</h3>

      <div class="video-body">
        <div class="video-thumb">
          <img
            id="watch-thumbnail"
            src=""
            alt="Video Thumbnail"
            width="200"
            height="113"
          >
        </div>

        <div class="video-info">
          <div class="video-info-stats">
            <div id="watch-video-title" hidden>
              <strong>Video Title:</strong>
              <span></span>
            </div>
            <div>
              <strong>Date Aired:</strong>
              <span id="watch-date">Loading…</span>
            </div>
            <div id="watch-song-count">
              <strong># of Songs:</strong>
              <span></span>
            </div>
          </div>

          <div class="video-info-actions">
            <div>
              <button
                id="desc-link"
                class="btn btn--outline desc-link"
                type="button"
              >
                View Description
              </button>
            </div>
            <div>
              <button
                id="watch-video-info"
                class="btn btn--outline"
                type="button"
              >
                View Video Info
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="player-container">
      <video
        id="player"
        class="video-js vjs-default-skin"
        controls
        preload="auto"
      ></video>
    </div>
  </div>

  <p id="watch-error" role="alert" hidden></p>

  <div id="description-modal">
    <div id="description-overlay"></div>
    <div id="description-box">
      <div id="description-header">
        <strong>Video Description</strong>
        <button id="description-close" type="button" aria-label="Close description">✕</button>
      </div>
      <div id="description-body"></div>
    </div>
  </div>
</div>

<script src="/assets/js/watch.js"></script>
</body>
</html>
